name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Functional Test Suite
        run: node ./scripts/verify_functionality.js

      - name: Run Agent Reliability Tests
        run: node ./scripts/run-ts-test.mjs test_agent_reliability.ts

      - name: Run Agent Engine Tests (scripted model)
        run: node ./scripts/run-ts-test.mjs test_agent_engine.ts

      - name: Run Architecture Tests
        run: node ./scripts/run-ts-test.mjs test_production_architecture.ts

      - name: Run Web Access Tests
        run: node ./scripts/run-ts-test.mjs test_web_access.ts

      - name: Check Shell Script Syntax
        shell: bash
        run: bash -n build/linux-installer.sh && bash -n scripts/linux-smoke-test.sh

      - name: Build Web Application
        run: npm run build:vite

