name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One system failing must not hide the result of the other.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      # Every suite of "npm test": agent, web access, security rules, wizards, design themes, chat Markdown.
      - name: Run Test Suites
        run: npm test

      # The isolated environment of agent commands, tried for real: emir-sandbox.exe on Windows,
      # bubblewrap on Linux (Ubuntu restricts unprivileged user namespaces; the runner allows them).
      - name: Build Command Isolation Launcher (Windows)
        if: runner.os == 'Windows'
        run: node ./scripts/build-sandbox.cjs

      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Full isolation on Windows runs commands as a separate local account, which an administrator
      # sets up once. The runner is an administrator, so the test tries the real thing here.
      - name: Set Up Full Isolation (Windows)
        if: runner.os == 'Windows'
        run: native/windows/bin/emir-sandbox.exe --setup

      - name: Run Command Isolation Tests
        run: node ./scripts/run-ts-test.mjs test_sandbox.ts
        env:
          EMIR_REQUIRE_FULL: ${{ runner.os == 'Windows' && '1' || '' }}

      - name: Check Shell Script Syntax
        shell: bash
        run: bash -n build/linux-installer.sh && bash -n scripts/linux-smoke-test.sh

      - name: Build Web Application
        run: npm run build:vite

