name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (NSIS & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Functional Test Suite
        run: node ./scripts/verify_functionality.js

      - name: Build Vite & Web Assets
        run: npm run build:vite

      # scripts/afterPack.js embeds the Emir Code icon and version info into EmirCode.exe
      # before the installer and the portable exe are created.
      - name: Build Windows Executables (Installer & Portable)
        run: npx electron-builder --win --publish never

      - name: Verify Executable Icon & Metadata
        shell: pwsh
        run: |
          $info = (Get-Item "release/win-unpacked/EmirCode.exe").VersionInfo
          Write-Host "ProductName=$($info.ProductName) FileVersion=$($info.FileVersion)"
          if ($info.ProductName -ne 'Emir Code') { throw "EmirCode.exe still carries Electron's metadata/icon" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap

  build-linux:
    name: Build Linux Release (DEB, RPM, AppImage, Tarball & GUI Installer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux Packaging Tools (fpm & rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools
          sudo gem install --no-document fpm

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Functional Test Suite
        run: node ./scripts/verify_functionality.js

      - name: Build Vite & Web Assets
        run: npm run build:vite

      - name: Build Linux Distributables (deb, rpm, AppImage, tar.gz)
        run: npx electron-builder --linux deb rpm AppImage tar.gz --publish never

      - name: Bundle Standalone Linux GUI Installer
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed "s/^APP_VERSION=.*/APP_VERSION=\"$VERSION\"/" build/linux-installer.sh > release/emir-code-setup-linux.sh
          chmod +x release/emir-code-setup-linux.sh
          grep -n '^APP_VERSION=' release/emir-code-setup-linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.tar.gz
            release/*.sh
            release/*.blockmap

  # Starts every Linux package (AppImage, deb, rpm, tar.gz, setup script) on a virtual display
  # and checks that the main window loads. Reported separately; it does not block publishing.
  linux-smoke-test:
    name: Linux Smoke Test (AppImage, deb, rpm, tar.gz, setup script)
    runs-on: ubuntu-latest
    needs: build-linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-dist

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils rpm2cpio cpio
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Launch Every Package
        run: bash scripts/linux-smoke-test.sh release-dist

  publish-release:
    name: Publish All Release Packages
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Emir Code ${{ github.ref_name || inputs.tag_name }}"
          tag_name: "${{ github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-dist/*.exe
            release-dist/*.deb
            release-dist/*.rpm
            release-dist/*.AppImage
            release-dist/*.tar.gz
            release-dist/*.sh
            release-dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

